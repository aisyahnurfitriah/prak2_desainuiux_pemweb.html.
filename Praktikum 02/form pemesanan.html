<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Form Pemesanan Barang</title>
</head>

<body>
    <form action="hasil pemesanan.html" method="get">
        
        <table align="center" border="2" bordercolor="#333333" bgcolor="#f2f2f2" cellspacing="0" cellpadding="20">
            <tr>
                <td>
                    <h2 align="center">Form Pemesanan Barang</h2>
                    <hr>
                    
                    <table align="center" cellspacing="0" cellpadding="5">
                        <tr>
                            <td>Title Here</td>
                            <td>: <input type="text" name="title" value=""></td>
                        </tr>
                        <tr>
                            <td valign="top">Description</td>
                            <td>: <textarea name="description" rows="4" cols="20"></textarea></td>
                        </tr>
                        <tr>
                            <td>Account Number</td>
                            <td>: <input type="text" name="acc_number" value=""></td>
                        </tr>
                        <tr>
                            <td>Bank</td>
                            <td>:
                                <select name="bank">
                                    <option>Mandiri</option>
                                    <option>BCA</option>
                                    <option>BRI</option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <td>Account Holder</td>
                            <td>: <input type="text" name="acc_holder" value=""></td>
                        </tr>
                        <tr>
                            <td>Transaction</td>
                            <td>: <input type="number" name="transaction" min="1" max="5" value=""></td>
                        </tr>
                        <tr>
                            <td></td>
                            <td><input type="checkbox" name="send_phone" checked> Send to Mobile Phone</td>
                        </tr>
                        <tr>
                            <td></td>
                            <td><input type="checkbox" name="send_email" checked> Send to Email</td>
                        </tr>
                        <tr>
                            <td>Send to Mobile Phone</td>
                            <td>: <input type="text" name="phone" value=""></td>
                        </tr>
                        <tr>
                            <td>Send to Email</td>
                            <td>: <input type="text" name="email" value=""></td>
                        </tr>
                    </table>
                    
                    <p align="center">
                        <input type="submit" value="Submit">
                        <input type="reset" value="Reset">
                    </p>
                </td>
            </tr>
        </table>
    </form>
</body>

</html>
