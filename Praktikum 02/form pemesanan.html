<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Form Pemesanan Barang</title>
</head>

<body>

    <h2 align="center">Form Pemesanan Barang</h2>
    <hr>

    <table align="center" cellpadding="10">
        <tr>
            <td valign="top">
                <img src="/Praktikum 02/img.jpeg"
                     alt="Gambar Barang"
                     width="250">
            </td>
            <td valign="top">
                <form action="hasil pemesanan.html" method="get">
                    <table cellpadding="5">
                        <tr>
                            <td>Title Here</td>
                            <td>:
                                <input type="text" name="title">
                            </td>
                        </tr>
                        <tr>
                            <td valign="top">Description</td>
                            <td>:
                                <textarea name="description"rows="4" cols="20"></textarea>
                            </td>
                        </tr>
                        <tr>
                            <td>Account Number</td>
                            <td>:
                                <input type="text" name="acc_number">
                            </td>
                        </tr>
                        <tr>
                            <td>Bank</td>
                            <td>:
                                <select name="bank">
                                     <option>Mandiri</option>
                                     <option>BCA</option>
                                    <option>BRI</option>
                               </select>
                            </td>
                        </tr>
                        <tr>
                            <td>Account Holder</td>
                            <td>:
                                <input type="text" name="acc_holder">
                            </td>
                        </tr>
                        <tr>
                            <td>Transaction</td>
                            <td>:
                                <input type="number" name="transaction"
                    min="1" max="5">
                            </td>
                        </tr>
                        <tr>
                            <td></td>
                            <td>
                                <input type="checkbox" name="send_phone" checked>
                    Send to Mobile Phone
                            </td>
                        </tr>
                        <tr>
                            <td></td>
                            <td>
                                <input type="checkbox" name="send_email"checked>
                    Send to Email
                            </td>
                        </tr>
                        <tr>
                <td>Send to Mobile Phone</td>
                            <td>:
                                <input type="text" name="phone">
                            </td>
                        </tr>
                        <tr>
                  <td>Send to Email</td>
                            <td>:
                                <input type="text" name="email">
                            </td>
                        </tr>
                        <tr>
                            <td></td>
                            <td>
                                <input type="submit" value="Submit">
                                <input type="reset" value="Reset">
                            </td>
                        </tr>
                    </table>
                </form>
            </td>
        </tr>
    </table>
</body>
</html>
