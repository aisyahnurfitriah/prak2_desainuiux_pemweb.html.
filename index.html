<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
</head>
<body>
  <h1>Form pemesanan pizza</h1>
  <p>
    silakan isi form pemesanan ini dengan lengkap dan benar.
  </p>
  
  <form action="hasil.html" method="get">
    <fieldset>
      <legend>Informasi Pemesan</legend>
      <p>
        <label for="Customername">Nama:</label>
        <input type="text" id="Customername" name="Customername" required>
      </p>
      <p>
        <label for="Addres">Addres:</label>
        <input type="text" id="Adress" name="Addres" required>
      </p>
      <p>
        <label for="Telephone">Telephone:</label>
        <input type="text" id="Telephone" name="Telephone" required>
      </p>
      <p>
        <label for="Email">Nama:</label>
        <input type="text" id="Email" name="Email" required>
      </p>
      <label for="intruction">delivery intruction:</label><br>
      <textarea
        id="intruction"
        name="intruction"
        rows="4"
        cols="50"
        maxlength="400"
        placeholder="no more than 400 characters"></textarea>
    </fieldset>
    
    <fieldset>
      <legend>design your dream</legend>
      <p><strong>pizza specs</strong></p>
      <p>pilih salah satu</p>
      <p>
        <input type="radio" id="Classic" name="topings" value="Classic white" required>
        <label for="classic white">Classic white</label><br>
        
        <input type="radio" id="classic" name="topings" value="classic white" required>
        <label for="classic white">peperoni</label><br>
        
        <input type="radio" id="Chiken" name="topings" value="Chiken" required>
        <label for="classic white">Chiken</label><br>
        
        <input type="radio" id="Cheese" name="topings" value="Cheese" required>
        <label for="Cheese">Cheese</label><br>
      </p>
      
      <p><strong>Toping</strong></p>
      <p>pilih salah satu</p>
      <p>
        <input type="checkbox" id="Classic" name="topings" value="Classic white" required>
        <label for="classic white">Classic white</label><br>
        
        <input type="checkbox" id="classic" name="topings" value="classic white" required>
        <label for="classic white">peperoni</label><br>
        
        <input type="checkbox" id="Chiken" name="topings" value="Chiken" required>
        <label for="classic white">Chiken</label><br>
        
        <input type="checkbox" id="Cheese" name="topings" value="Cheese" required>
        <label for="Cheese">Cheese</label><br>
        
        <input type="checkbox" id="Cheese" name="topings" value="Cheese" required>
        <label for="Cheese">Cheese</label><br>
        
        <input type="checkbox" id="Cheese" name="topings" value="Cheese" required>
        <label for="Cheese">Cheese</label><br>
        
        <input type="checkbox" id="Cheese" name="topings" value="Cheese" required>
        <label for="Cheese">Cheese</label><br>
      </p>
      <p>
        <label for="quantity">quantity:</label>
        <select id="quantity" name="quantity" required>
        <option value="">--pilih jumlah--</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        </select>
      </p>
    </fieldaet>
  </form>
  <p>
    <input type="submit" value="submit">
    <input type="reset" value="reset">
  </p>
</body>
</html>
